syntax = "proto3";

package gqe.proto;

service LogStreamService {
  rpc StreamLogs(stream LogStreamMessage) returns (LogStreamAck) {}
}

message LogStreamMessage {
  oneof payload {
    LogStreamHeader header = 1;
    LogRecord record = 2;
  }
}

message LogStreamHeader {
  string source_tag = 1;
  uint64 pid = 2;
}

enum LogLevel {
  LOG_LEVEL_TRACE = 0;
  LOG_LEVEL_DEBUG = 1;
  LOG_LEVEL_INFO = 2;
  LOG_LEVEL_WARN = 3;
  LOG_LEVEL_ERROR = 4;
  LOG_LEVEL_CRITICAL = 5;
}

message LogRecord {
  uint64 timestamp_ns = 1;
  LogLevel level = 2;
  uint64 thread_id = 3;
  string body = 4;
  uint64 dropped_before = 5;
}

message LogStreamAck {
  uint64 records_received = 1;
}
